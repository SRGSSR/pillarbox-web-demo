version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- NPM: demo ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # --- NPM: samples ---
  - package-ecosystem: "npm"
    directory: "/samples/angular"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
      # Angular versions require running `ng update` migrations manually,
      # and typescript/rxjs must stay within Angular's supported range.
      - dependency-name: "@angular/*"
      - dependency-name: "typescript"
      - dependency-name: "rxjs"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/samples/lightningjs"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/samples/react"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
      # eslint-plugin-react does not support eslint 10 yet
      - dependency-name: "eslint"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@eslint/js"
        update-types: [ "version-update:semver-major" ]
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/samples/umd"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/samples/vanilla-ts"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "npm"
    directory: "/samples/vue"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@srgssr/*"
      - dependency-name: "video.js"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
